[package]
name = "cant"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ECS"
authors = ["Ivan Chetchasov <vi.is.chapmann@gmail.com>"]
repository = "https://github.com/ursetek/cant"
rust-version = "1.98.1"

[dependencies]
rayon = "1"
rustc-hash = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[lints]
rust.missing_docs = "deny"
clippy.all = "warn"
clippy.pedantic = "warn"
